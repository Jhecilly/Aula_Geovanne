<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title> Helpdesk 3°B - Painel de Atendimento </title>
</head>
<body>
    <header>
        <h1> Central de Suporte de TI </h1>
        <hr>
    </header>
    <main>
        <section>
            <h2> Resumo operacional </h2>
            <ul>
                <li><strong> Chamados abertos: </strong></li>
                <li><strong> Em andamento: </strong></li>
                <li><strong> Concluídos hoje: </strong></li>
            </ul>
        </section>

        <hr>

        <section>
            <h2> Abrir novo chamado </h2>
            <form>
                <label for="solicitante">Nome do solicitante</label><br>
                <input type="text" id="solicitante" required><br><br> 

                <label for="setor">Setor:</label><br>
                <select id="setor" required>
                    <option value="">Selecione o setor...</option>
                    <option value="financeiro">Financeiro</option>
                    <option value="rh">Recursos Humanos</option>
                    <option value="producao">Produção</option>
                    <option value="vendas">Vendas</option>
                </select><br><br>

                <label> Prioridade do chamado </label>
                <input type="radio" id=p_baixa" name="prioridade" value="baixa">
                <label for="p_baixa">Baixa</label>

                <input type="radio" id=me="p_media" name="prioridade" value="media">
                <label for="p_media">Média</label>

                <input type="radio" id=p_critica" name="prioridade" value="critica">
                <label for="p_critica">Crítica</label>
                
            </form>
        </section>


    </main>
</body>
</html>
