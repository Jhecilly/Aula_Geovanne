<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title> Exercicio 16 - pesquisa </title>
</head>
<body>
    <h1> Pesquisa de opinião </h1>

    <form> 

        <h3> Selecione seu gênero: </h3>
        <input type="radio" id="masc" name="genero" value="masculino">
        <label for="masc"> Masculino </label>

        <input type="radio" id="fem" name="genero" value="feminino">
        <label for="fem"> Feminino </label>


        <input type="radio" id="outro" name="genero" value="outro">
        <label for="outro"> Outros </label>

        <h3> Quais são seus hobbies? (Selecione quantos quiser): </h3>

        <input type="checkbox" id="futebol" value="futebol">
        <label for="futebol"> Jogar futebol </label>

        <input type="checkbox" id="cinema" value="cinema">
        <label for="cinema"> Ir ao cinema </label>

        <input type="checkbox" id="musica" value="musica">
        <label for="musica"> Ouvir musica </label>

        <button type="submit"> Enviar resposta </button>


    </form>





</body>
</html>
