<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title> exercício 14 - tela login </title>
</head>
<body>

    <h1> Acessar o sistema </h1>


    <form>
        <label for="email"> Email </label> <!-- legenda que aparece na caixa de texto -->
        <input type="email" id="email" required><br><br> <!-- faz com que o campo seja interativo (input), e o id é pra referenciar o "email" ao for "email" -->

        <label for="senha"> Senha </label>
        <input type="password" id="senha" required><br><br>

        <label for="idade"> idade </label>
        <input type="number" id="idade" min="1" max="129"><br><br>

        <button type="submit"> Entrar </button>


    </form>
    
</body>
</html>
